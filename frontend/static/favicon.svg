<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="pole"><rect x="10" y="2" width="12" height="28" rx="6"/></clipPath>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="16" height="16" fill="#fff"/>
      <rect width="4" height="16" fill="#7A1F2B"/>
      <rect x="8" width="4" height="16" fill="#2B4C7E"/>
    </pattern>
  </defs>
  <rect x="10" y="2" width="12" height="28" fill="url(#stripes)" clip-path="url(#pole)"/>
  <rect x="10" y="2" width="12" height="28" rx="6" fill="none" stroke="#3A2A22" stroke-width="2.5"/>
</svg>
