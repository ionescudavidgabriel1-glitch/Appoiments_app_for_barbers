{#- One layout for every booking email. Inline styles, because many mail apps
    ignore <style> blocks. Colors follow the app: towel, walnut, oxblood, mint. -#}
<!doctype html>
<html lang="{{ shop.language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading }}</title>
</head>
<body style="margin:0;padding:0;background:#FAF6F1;color:#3A2A22;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF6F1;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
          <tr>
            <td style="padding-bottom:20px;font-size:14px;color:#6F625A;">{{ shop.name }}</td>
          </tr>
          <tr>
            <td style="background:#FFFFFF;border:1px solid #E8DFD5;border-radius:20px;padding:28px;">
              <h1 style="margin:0 0 8px;font-size:28px;line-height:1.15;color:#3A2A22;">{{ heading }}</h1>
              <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#6F625A;">{{ intro }}</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:15px;line-height:1.4;">
                {% set rows = [
                  (_("When"), d.date ~ ", " ~ d.time ~ "–" ~ d.end_time),
                  (_("Service"), d.service ~ " · " ~ d.price),
                ] %}
                {% if for_barber %}
                  {% set rows = rows + [(_("Customer"), d.guest), (_("Phone"), a.guest_phone)] %}
                {% else %}
                  {% set rows = rows + [(_("Barber"), d.barber), (_("Where"), shop.name ~ (", " ~ shop.address if shop.address else ""))] %}
                {% endif %}
                {% for label, value in rows %}
                  <tr>
                    <td style="border-top:1px solid #E8DFD5;padding:10px 12px 10px 0;width:90px;color:#6F625A;vertical-align:top;">{{ label }}</td>
                    <td style="border-top:1px solid #E8DFD5;padding:10px 0;font-weight:600;">{{ value }}</td>
                  </tr>
                {% endfor %}
              </table>

              {% if button_url and button_label %}
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:24px;">
                  <tr>
                    <td style="background:#7A1F2B;border-radius:12px;">
                      <a href="{{ button_url }}" style="display:inline-block;padding:13px 22px;color:#FFFFFF;font-weight:700;text-decoration:none;font-size:16px;">{{ button_label }}</a>
                    </td>
                  </tr>
                </table>
              {% endif %}

              {% if note %}
                <p style="margin:20px 0 0;font-size:14px;line-height:1.5;color:#6F625A;">{{ note }}</p>
              {% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding-top:20px;font-size:12px;color:#6F625A;">
              {{ _("Sent by %(shop)s through Barbershop Appointments.", shop=shop.name) }}
              {% if shop.phone and not for_barber %}<br>{{ _("Questions? Call %(phone)s.", phone=shop.phone) }}{% endif %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
